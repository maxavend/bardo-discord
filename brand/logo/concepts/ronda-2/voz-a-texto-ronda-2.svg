<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1498" viewBox="0 0 1600 1498"><rect width="1600" height="1498" fill="#f7f7f4"/><text x="60" y="78" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" font-weight="700" fill="#161616">Bardo — Voz a texto, ronda 2</text><text x="60" y="116" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#6b6b6b">Variantes sobre el ritmo «calma»: la onda arranca fuerte y se asienta en una línea recta.</text><rect x="60" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path d="M44 72 C56.24 50 65.76 50 78 72 C90.24 94 99.76 85 112 72 C124.24 59 133.76 67 146 72 C158.24 77 167.76 72 180 72 L212 72 M44 128 L212 128 M44 184 L156 184" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></g><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="90" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet"><path d="M44 72 C56.24 50 65.76 50 78 72 C90.24 94 99.76 85 112 72 C124.24 59 133.76 67 146 72 C158.24 77 167.76 72 180 72 L212 72 M44 128 L212 128 M44 184 L156 184" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="122" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="180" y="548" width="32" height="32" preserveAspectRatio="xMidYMid meet"><path d="M44 72 C56.24 50 65.76 50 78 72 C90.24 94 99.76 85 112 72 C124.24 59 133.76 67 146 72 C158.24 77 167.76 72 180 72 L212 72 M44 128 L212 128 M44 184 L156 184" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="196" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">32px</text><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="238" y="564" width="16" height="16" preserveAspectRatio="xMidYMid meet"><path d="M44 72 C56.24 50 65.76 50 78 72 C90.24 94 99.76 85 112 72 C124.24 59 133.76 67 146 72 C158.24 77 167.76 72 180 72 L212 72 M44 128 L212 128 M44 184 L156 184" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="246" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">16px</text><text x="90.0" y="636" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">A · Libre</text><text x="90.0" y="670" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">Tres líneas; la primera todavía es voz y se</text><text x="90.0" y="696" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">calma hasta volverse texto.</text><rect x="562.667" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path d="M40 100 C52.96 84 63.04 76 76 100 C88.96 124 99.04 113 112 100 C124.96 87 135.04 95 148 100 C160.96 105 171.04 100 184 100 L216 100 M40 160 L148 160" fill="none" stroke="#000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><circle cx="198" cy="160" r="15"/></svg></g><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="516" width="64" height="64" preserveAspectRatio="xMidYMid me