system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#161616">D · Globo</text><text x="90.0" y="1328" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">Las líneas dentro de un globo de chat: nace</text><text x="90.0" y="1354" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">en la conversación del canal.</text><rect x="562.667" y="808" width="474.667" height="630" rx="18" fill="#fff" stroke="#161616" stroke-width="2"/><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="848" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><rect x="16" y="16" width="224" height="224" rx="56"/><path d="M64 88 C73.36 70.4 80.64 70.4 90 88 C99.36 105.6 106.64 98.4 116 88 C125.36 77.6 132.64 84 142 88 C151.36 92 158.64 88 168 88 L192 88 M64 136 L192 136 M64 184 L148 184" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg></g><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="592.667" y="1174" width="64" height="64" preserveAspectRatio="xMidYMid meet"><rect x="16" y="16" width="224" height="224" rx="56"/><path d="M64 88 C73.36 70.4 80.64 70.4 90 88 C99.36 105.6 106.64 98.4 116 88 C125.36 77.6 132.64 84 142 88 C151.36 92 158.64 88 168 88 L192 88 M64 136 L192 136 M64 184 L148 184" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="624.667" y="1258" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="682.667" y="1206" width="32" height="32" preserveAspectRatio="xMidYMid meet"><rect x="16" y="16" width="224" height="224" rx="56"/><path d="M64 88 C73.36 70.4 80.64 70.4 90 88 C99.36 105.6 106.64 98.4 116 88 C125.36 77.6 132.64 84 142 88 C151.3