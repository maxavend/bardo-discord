: voz, una línea escrita y punto.</text><text x="592.6666666666667" y="696" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#555">Lo dicho queda cerrado.</text><rect x="1065.33" y="150" width="474.667" height="630" rx="18" fill="#fff" stroke="#e4e4e0" stroke-width="1"/><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1095.33" y="190" width="414.667" height="300" preserveAspectRatio="xMidYMid meet"><path d="M60 48 C68.64 32.16 75.36 32.16 84 48 C92.64 63.84 99.36 57.36 108 48 C116.64 38.64 123.36 44.4 132 48 C140.64 51.6 147.36 48 156 48 L156 48 A38 38 0 0 1 136 124 L60 124 M60 124 L144 124 A40 40 0 0 1 144 204 L60 204 M60 48 V204" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></svg></g><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1095.33" y="516" width="64" height="64" preserveAspectRatio="xMidYMid meet"><path d="M60 48 C68.64 32.16 75.36 32.16 84 48 C92.64 63.84 99.36 57.36 108 48 C116.64 38.64 123.36 44.4 132 48 C140.64 51.6 147.36 48 156 48 L156 48 A38 38 0 0 1 136 124 L60 124 M60 124 L144 124 A40 40 0 0 1 144 204 L60 204 M60 48 V204" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="1127.33" y="600" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle">64px</text><g><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" x="1185.33" y="548" width="32" height="32" preserveAspectRatio="xMidYMid meet"><path d="M60 48 C68.64 32.16 75.36 32.16 84 48 C92.64 63.84 99.36 57.36 108 48 C116.64 38.64 123.36 44.4 132 48 C140.64 51.6 147.36 48 156 48 L156 48 A38 38 0 0 1 136 124 L60 124 M60 124 L144 124 A40 40 0 0 1 144 204 L60 204 M60 48 V204" fill="none" stroke="#000" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="1201.33" y="600" font-family="system-ui,-apple-sys