<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Bardo Docs Prototype</title>
<style>html,body{margin:0;background:#111214;color:#f4f5f6;font-family:system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot p{opacity:.7}</style>
</head>
<body>
<div class="boot"><div><strong>Cargando Bardo Docs…</strong><p>Prototipo funcional de estrés</p></div></div>
<script type="module">
const parts=['payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt'];
try {
  if (!('DecompressionStream' in window)) throw new Error('unsupported');
  const encoded=(await Promise.all(parts.map(async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw new Error(p);return r.text()}))).join('');
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
} catch (error) {
  document.body.innerHTML='<div class="boot"><div><strong>No se pudo cargar Bardo Docs.</strong><p>Recarga la página en Safari actualizado.</p></div></div>';
  console.error(error);
}
</script>
</body>
</html>
