<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Bardo Docs Prototype · v26</title>
<style>html,body{margin:0;background:#111214;color:#f4f5f6;font-family:system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.boot p{opacity:.7;line-height:1.5}.boot button{margin-top:12px;min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#f4f5f6;color:#111214;font:inherit;font-weight:700}</style>
</head>
<body>
<div class="boot"><div><strong>Cargando Bardo Docs v26…</strong><p>Prototipo funcional auditado</p></div></div>
<script type="module">
const VERSION='26';
const parts=['v26-01.txt','v26-02.txt','v26-03.txt','v26-04.txt','v26-05.txt','v26-06.txt','v26-07.txt','v26-08.txt'];
try {
  if (!('DecompressionStream' in window)) throw new Error('Este navegador no soporta DecompressionStream');
  const encoded=(await Promise.all(parts.map(async p=>{
    const r=await fetch(`${p}?v=${VERSION}`,{cache:'no-store'});
    if(!r.ok) throw new Error(`${p}: HTTP ${r.status}`);
    return (await r.text()).trim();
  }))).join('');
  const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  if(!html.includes('Wireframe v26')) throw new Error('Payload v26 inválido o incompleto');
  document.open();document.write(html);document.close();
} catch (error) {
  console.error(error);
  document.body.innerHTML='<div class="boot"><div><strong>No se pudo cargar Bardo Docs.</strong><p>Recarga la página en Safari actualizado. Si continúa, abre nuevamente el enlace de Pages.</p><button type="button" id="retry">Reintentar</button></div></div>';
  document.getElementById('retry')?.addEventListener('click',()=>location.reload());
}
</script>
</body>
</html>
