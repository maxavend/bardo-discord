<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Bardo · Kanban</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button class="title-button" id="board-picker-btn" type="button" aria-haspopup="dialog">
      <span id="board-title">Kanban</span><span class="chevron" aria-hidden="true">⌄</span>
    </button>
    <div class="top-actions">
      <button class="icon-button" id="toggle-search" type="button" aria-label="Buscar">⌕</button>
      <button class="icon-button" id="open-settings" type="button" aria-label="Opciones del tablero">•••</button>
      <button class="new-button" id="new-task-top" type="button" aria-label="Nueva tarea">＋</button>
    </div>
  </header>

  <main>
    <section class="search-panel" id="search-panel" hidden>
      <label class="search-field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Buscar tareas…" autocomplete="off"></label>
      <div class="filter-row" aria-label="Filtros rápidos">
        <button class="filter-chip active" type="button" data-filter="all">Todas</button>
        <button class="filter-chip" type="button" data-filter="mine">Mías</button>
        <button class="filter-chip" type="button" data-filter="urgent">Urgentes</button>
        <button class="filter-chip" type="button" data-filter="unassigned">Sin responsable</button>
        <button class="filter-chip" type="button" data-filter="comments">Con comentarios</button>
      </div>
    </section>

    <nav class="mobile-tabs" id="mobile-tabs" aria-label="Columnas"></nav>
    <section class="board" id="board" aria-live="polite"></section>
  </main>
</div>

<div class="toast" id="toast" hidden><span id="toast-text"></span><button type="button" id="toast-undo" hidden>Deshacer</button></div>

<dialog id="board-picker-dialog">
  <div class="sheet board-sheet">
    <header class="sheet-top"><h2>Tableros</h2><button class="icon-button close" type="button" aria-label="Cerrar">×</button></header>
    <div class="board-list" id="board-list"></div>
    <button class="row-action" id="create-board" type="button">＋ Nuevo tablero</button>
  </div>
</dialog>

<dialog id="quick-dialog">
  <form class="sheet quick-sheet" id="quick-form">
    <header class="sheet-top"><button class="text-button close" type="button">Cancelar</button><h2>Nueva tarea</h2><button class="text-button strong" type="submit">Crear</button></header>
    <input class="quick-title" id="quick-title" maxlength="180" required placeholder="¿Qué hay que hacer?" autocomplete="off">
    <div class="quick-context">En <select id="quick-status" aria-label="Columna"></select></div>
  </form>
</dialog>

<dialog id="task-dialog">
  <div class="sheet task-sheet">
    <header class="sheet-top sticky">
      <button class="text-button close" type="button">Cerrar</button>
      <span class="save-state" id="save-state">Guardado</span>
    </header>

    <div class="task-editor">
      <textarea class="task-title-input" id="task-title" rows="1" maxlength="180" aria-label="Título"></textarea>
      <textarea class="task-description-input" id="task-description" rows="3" maxlength="3000" placeholder="Añade una descripción…" aria-label="Descripción"></textarea>

      <div class="properties">
        <label class="property"><span>Estado</span><select id="task-status"></select></label>
        <label class="property"><span>Responsable</span><select id="task-assignee"></select></label>
        <label class="property"><span>Prioridad</span><select id="task-priority"><option value="low">Baja</option><option value="normal">Normal</option><option value="high">Alta</option><option value="urgent">Urgente</option></select></label>
      </div>

      <section class="task-section tags-section">
        <header><h3>Tags</h3><small>máximo 8 en este tablero</small></header>
        <div class="tag-picker" id="task-tags"></div>
      </section>

      <section class="task-section">
        <header><h3>Subtareas</h3><small id="subtask-progress"></small></header>
        <div class="subtasks" id="subtasks"></div>
        <form class="inline-add" id="subtask-form"><input id="subtask-input" maxlength="160" placeholder="Añadir subtarea…"><button type="submit">Añadir</button></form>
      </section>

      <section class="task-section">
        <header><h3>Comentarios</h3><small id="comment-count"></small></header>
        <div class="comments" id="comments"></div>
        <form class="comment-add" id="comment-form"><textarea id="comment-input" rows="2" maxlength="800" placeholder="Escribe un comentario…"></textarea><button type="submit">Comentar</button></form>
      </section>

      <div class="danger-zone">
        <button class="text-button" id="duplicate-task" type="button">Duplicar</button>
        <button class="text-button danger" id="delete-task" type="button">Eliminar tarea</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="settings-dialog">
  <div class="sheet settings-sheet">
    <header class="sheet-top sticky"><h2>Tablero</h2><button class="icon-button close" type="button" aria-label="Cerrar">×</button></header>

    <label class="settings-field"><span>Nombre</span><input id="settings-title" maxlength="48"></label>

    <section class="settings-section">
      <header><div><h3>Columnas</h3><p>4 por defecto · máximo 5</p></div><button class="text-button strong" id="add-column" type="button">＋ Añadir</button></header>
      <div id="columns-settings"></div>
    </section>

    <section class="settings-section">
      <header><div><h3>Tags</h3><p>máximo 8 por tablero</p></div></header>
      <div class="tag-manager" id="tag-settings"></div>
      <form class="inline-add" id="add-tag-form"><input id="new-tag-input" maxlength="24" placeholder="Nuevo tag…"><button type="submit">Añadir</button></form>
    </section>

    <details class="qa-details">
      <summary>Herramientas QA</summary>
      <div class="qa-body">
        <div id="qa-kpis" class="qa-kpis"></div>
        <div class="qa-actions">
          <button type="button" id="stress-250">＋250 tareas</button>
          <button type="button" id="stress-1000">＋1000 tareas</button>
          <button type="button" id="self-test">Autoprueba</button>
          <button type="button" id="clear-board">Vaciar tablero</button>
          <button type="button" class="danger" id="reset-all">Restablecer mocks</button>
        </div>
        <pre id="self-test-output" hidden></pre>
      </div>
    </details>

    <div class="settings-bottom">
      <button class="text-button" id="duplicate-board" type="button">Duplicar tablero</button>
      <button class="text-button danger" id="delete-board" type="button">Eliminar tablero</button>
      <button class="primary-button" id="save-settings" type="button">Listo</button>
    </div>
  </div>
</dialog>

<script src="./chunk-1.js" defer></script>
<script src="./chunk-2.js" defer></script>
<script src="./chunk-2b.js" defer></script>
<script src="./chunk-3.js" defer></script>
<script src="./chunk-3b.js" defer></script>
<script src="./chunk-4.js" defer></script>
<script src="./chunk-5.js" defer></script>
<script src="./chunk-6.js" defer></script></body>
</html>
