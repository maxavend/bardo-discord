<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Sin conexión · Bardo</title>
<style>
:root{color-scheme:dark;--bg:oklch(.2 .014 292);--surface:oklch(.24 .016 292);--border:oklch(1 .02 300/.09);--text:oklch(.965 .006 305);--muted:oklch(.74 .02 300);--accent:oklch(.722 .177 305.5);--on-accent:oklch(.2 .04 300)}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:oklch(.985 .005 305);--surface:oklch(1 0 0);--border:oklch(.905 .012 305);--text:oklch(.2 .025 300);--muted:oklch(.5 .025 300);--accent:oklch(.496 .265 301.924);--on-accent:oklch(.985 .01 308)}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
main{width:100%;max-width:26rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center}
h1{font-size:1.25rem;line-height:1.3;margin:0 0 8px}p{margin:0 0 16px;color:var(--muted)}
button{font:inherit;font-weight:600;min-height:44px;padding:8px 20px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){main{animation:in .24s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<main role="alert">
  <h1>Sin conexión con Bardo</h1>
  <p>Revisa tu conexión a internet. Tus documentos, reuniones y tareas siguen guardados en Bardo.</p>
  <button type="button" id="retry" autofocus>Reintentar</button>
</main>
<script>
  const retry = new URLSearchParams(location.search).get('retry');
  const go = () => { if (/^https?:\/\//.test(retry || '')) location.href = retry; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);
</script>
</body>
</html>
