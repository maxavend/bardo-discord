# Empaquetado de Bardo para escritorio.
# Sin certificados, los builds salen sin firmar (sirven para probar). Con los
# secretos de CI (ver README.md de esta carpeta) se firman, se notarizan en
# macOS y se publican en GitHub Releases, de donde se actualizan solas.
appId: app.bardo.desktop
productName: Bardo
copyright: Copyright © 2026 Bardo
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - static/**
  - package.json
  - "!**/*.map"
asar: true
afterPack: build/after-pack.cjs
protocols:
  - name: Bardo
    schemes:
      - bardo
publish:
  provider: github
  owner: maxavend
  repo: bardo-discord
  releaseType: release

mac:
  category: public.app-category.productivity
  icon: build/icon-mac.png
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Se notariza solo si existen APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
  # (o APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID) en el entorno.
  extendInfo:
    NSMicrophoneUsageDescription: Bardo usa el micrófono solo cuando grabas una reunión.
    LSApplicationCategoryType: public.app-category.productivity
dmg:
  title: Bardo ${version}
  artifactName: Bardo-${version}-mac.${ext}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Bardo-${version}-windows-${arch}.${ext}
  # Se firma si existen WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD; si no, sale sin firmar.
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Bardo
appx:
  # Paquete para Microsoft Store (npm run dist:store). Los datos de identidad
  # salen del Partner Center al reservar el nombre «Bardo».
  identityName: Bardo
  publisherDisplayName: Bardo
  displayName: Bardo
  applicationId: Bardo
  backgroundColor: "#16131c"
  languages: [es-419, es-ES, en-US]
