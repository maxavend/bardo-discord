name: Emergency deploy Bardo Docs

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/emergency-bardo-docs-deploy.yml'
      - 'diagnostics/emergency-activity-check.txt'
  workflow_dispatch:

concurrency:
  group: emergency-bardo-docs-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        id: rootdeps
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Observe Worker secrets
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 secret list --json > /tmp/secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          const names = new Set((Array.isArray(data) ? data : []).map(x => x.name));
          for (const required of ['DISCORD_PUBLIC_KEY','DISCORD_TOKEN','DISCORD_CLIENT_SECRET']) {
            console.log(`${required}=${names.has(required) ? 'secret' : 'not-listed-as-secret'}`);
          }
          NODE

      - name: Run Bardo tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Wire authenticated Docs routes, inline Activity response and diagnostic
        id: patch
        continue-on-error: true
        run: |
          node scripts/apply-production-worker.mjs src/worker.js
          node scripts/apply-inline-activity-launch.mjs src/worker.js
          node scripts/apply-activity-diagnostic-route.mjs src/worker.js
          grep -q "handleDiscordAuthApi" src/worker.js
          grep -q "handleDocsApi" src/worker.js
          grep -q "return jsonResponse({ type: 12 });" src/worker.js
          grep -q "ctx.waitUntil(persistLaunchContext())" src/worker.js
          grep -q "__bardo_diag_activity_20260823" src/worker.js
          if grep -q "callback?with_response=true" src/worker.js; then
            echo "Remote interaction callback still present" >&2
            exit 1
          fi
          node --check src/worker.js

      - name: Install Docs app dependencies
        id: docsdeps
        continue-on-error: true
        run: npm install --prefix prototypes/docs-app --no-audit --no-fund

      - name: Build Docs Activity
        id: docsbuild
        continue-on-error: true
        run: npm run build --prefix prototypes/docs-app

      - name: Install Activity assets
        id: assets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf activity
          mkdir -p activity
          cp -R prototypes/docs-app/dist/. activity/
          test -f activity/index.html
          grep -q 'docs-current-document-only-v1' activity/index.html

      - name: Preflight gate
        id: preflight
        if: always()
        shell: bash
        env:
          ROOTDEPS: ${{ steps.rootdeps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          DOCSDEPS: ${{ steps.docsdeps.outcome }}
          DOCSBUILD: ${{ steps.docsbuild.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
        run: |
          set -euo pipefail
          for VALUE in "$ROOTDEPS" "$TESTS" "$PATCH" "$DOCSDEPS" "$DOCSBUILD" "$ASSETS"; do
            test "$VALUE" = success
          done

      - name: Apply D1 migrations
        id: migrate
        continue-on-error: true
        run: npx --yes wrangler@4.124.0 d1 migrations apply bardo-db --remote

      - name: Deploy Worker and validate required secrets
        id: deploy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 deploy --keep-vars 2>&1 | tee /tmp/emergency-deploy.log

      - name: Verify live Activity and read Discord app config
        id: live
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LIVE_HTTP=$(curl -sS -o /tmp/live.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?deploy=$GITHUB_SHA")
          LIVE_CURL=$?
          DIAG_HTTP=$(curl -sS -o /tmp/discord-app.json -w '%{http_code}' "$WORKER_ORIGIN/__bardo_diag_activity_20260823")
          DIAG_CURL=$?
          {
            echo "live_curl=$LIVE_CURL"
            echo "live_http=$LIVE_HTTP"
            echo "live_marker=$(grep -c 'docs-current-document-only-v1' /tmp/live.html 2>/dev/null || true)"
            echo "diag_curl=$DIAG_CURL"
            echo "diag_http=$DIAG_HTTP"
            echo "--- discord_app ---"
            cat /tmp/discord-app.json 2>/dev/null || true
          } > /tmp/activity-runtime.txt
          cat /tmp/activity-runtime.txt
          exit 0

      - name: Record emergency deploy status
        if: always()
        shell: bash
        env:
          ROOTDEPS: ${{ steps.rootdeps.outcome }}
          SECRETS: ${{ steps.secrets.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          DOCSDEPS: ${{ steps.docsdeps.outcome }}
          DOCSBUILD: ${{ steps.docsbuild.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE: ${{ steps.live.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          STATUS=failure
          if [ "$DEPLOY" = success ] && [ "$LIVE" = success ]; then STATUS=success; fi
          cat > .deploy/bardo-docs-emergency-status.txt <<EOF
          status=$STATUS
          source_commit=$GITHUB_SHA
          rootdeps=$ROOTDEPS
          secrets_observation=$SECRETS
          tests=$TESTS
          patch=$PATCH
          inline_launch=true
          docsdeps=$DOCSDEPS
          docsbuild=$DOCSBUILD
          assets=$ASSETS
          preflight=$PREFLIGHT
          migration=${MIGRATE:-skipped}
          deploy=${DEPLOY:-skipped}
          live=${LIVE:-skipped}
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          if [ -f /tmp/activity-runtime.txt ]; then cp /tmp/activity-runtime.txt .deploy/discord-activity-runtime.txt; fi
          if [ -f /tmp/emergency-deploy.log ]; then tail -n 100 /tmp/emergency-deploy.log > .deploy/emergency-wrangler-deploy.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-docs-emergency-status.txt
          [ ! -f .deploy/discord-activity-runtime.txt ] || git add .deploy/discord-activity-runtime.txt
          [ ! -f .deploy/emergency-wrangler-deploy.log ] || git add .deploy/emergency-wrangler-deploy.log
          git commit -m "chore(docs): record emergency Activity diagnosis [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true

# rerun marker: inline tests updated
