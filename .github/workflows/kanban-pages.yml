name: Kanban Pages QA

on:
  push:
    branches: ['module/kanban']
    paths:
      - 'prototypes/kanban-heroui/**'
      - '.github/workflows/kanban-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: github.ref_name == 'module/kanban'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: bardo-kanban
    steps:
      - name: Checkout module/kanban
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Install HeroUI app
        working-directory: prototypes/kanban-heroui
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: prototypes/kanban-heroui
        run: npm run typecheck

      - name: Build
        working-directory: prototypes/kanban-heroui
        run: npm run build

      - name: Deploy Kanban QA
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.125.0 pages deploy prototypes/kanban-heroui/dist \
            --project-name="$PAGES_PROJECT" \
            --branch='module-kanban' \
            --commit-hash='${{ github.sha }}' \
            --commit-message='Bardo Kanban HeroUI QA' 2>&1 | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/deploy.log | tail -1)
          test -n "$url" || { echo 'Deployment succeeded but URL was not found in Wrangler output'; cat /tmp/deploy.log; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url" | tee deployment-url.txt

      - name: Verify QA URL
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          curl --fail --silent --show-error --location --head \
            --retry 15 --retry-all-errors --retry-delay 2 --connect-timeout 10 \
            "$url" >/dev/null
          echo "### Kanban HeroUI QA" >> "$GITHUB_STEP_SUMMARY"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment URL
        uses: actions/upload-artifact@v4
        with:
          name: kanban-pages-url
          path: deployment-url.txt
          retention-days: 7
