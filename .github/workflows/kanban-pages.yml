name: Kanban Pages QA

on:
  push:
    branches: ['module/kanban']
    paths:
      - 'prototypes/kanban/**'
      - '.github/workflows/kanban-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/kanban/**'
      - '.github/workflows/kanban-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.head_ref == 'module/kanban' || github.ref_name == 'module/kanban'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: bardo-kanban
    steps:
      - name: Checkout module/kanban
        uses: actions/checkout@v6

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Ensure dedicated Kanban Pages project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages project list --json > /tmp/pages-projects.json
          exists=$(jq -r --arg project "$PAGES_PROJECT" '[.[] | select(."Project Name" == $project)] | length' /tmp/pages-projects.json)
          if [ "$exists" = "0" ]; then
            npx --yes wrangler@latest pages project create "$PAGES_PROJECT" --production-branch='module-kanban'
          else
            echo "Using existing dedicated Pages project: $PAGES_PROJECT"
          fi

      - name: Deploy Kanban QA
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy prototypes/kanban \
            --project-name="$PAGES_PROJECT" \
            --branch='module-kanban' \
            --commit-hash='${{ github.event.pull_request.head.sha || github.sha }}' \
            --commit-message='Bardo Kanban QA' 2>&1 | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/deploy.log | tail -1)
          test -n "$url" || { echo 'Deployment succeeded but URL was not found in Wrangler output'; cat /tmp/deploy.log; exit 1; }
          echo "$url" | tee deployment-url.txt
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify QA URL
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.deploy.outputs.url }}'
          curl --fail --silent --show-error --location --head "$url" >/dev/null
          echo "### Kanban QA" >> "$GITHUB_STEP_SUMMARY"
          echo "[$url]($url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment URL
        uses: actions/upload-artifact@v4
        with:
          name: kanban-pages-url
          path: deployment-url.txt
          retention-days: 7
