name: Diagnose Discord Activity configuration

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-discord-activity-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read sanitized Discord application configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCORD_TOKEN"
          curl -fsSL \
            -H "Authorization: Bot $DISCORD_TOKEN" \
            -H 'User-Agent: Bardo-Diagnostics/1.0' \
            https://discord.com/api/v10/applications/@me \
            -o /tmp/app.json
          node - <<'NODE' > /tmp/diag.txt
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('/tmp/app.json','utf8'));
          const flags = BigInt(app.flags_new ?? app.flags ?? 0);
          const EMBEDDED = 1n << 17n;
          console.log(`status=success`);
          console.log(`application_id=${app.id || 'unknown'}`);
          console.log(`application_name=${String(app.name || '').replace(/[^A-Za-z0-9 _.-]/g,'')}`);
          console.log(`embedded_flag=${(flags & EMBEDDED) !== 0n ? 'true' : 'false'}`);
          console.log(`flags=${flags.toString()}`);
          console.log(`interactions_endpoint_url=${app.interactions_endpoint_url || 'null'}`);
          console.log(`redirect_uris_count=${Array.isArray(app.redirect_uris) ? app.redirect_uris.length : 0}`);
          for (const uri of (app.redirect_uris || [])) console.log(`redirect_uri=${uri}`);
          console.log(`guild_install=${app.integration_types_config?.['0'] ? 'configured' : 'not-configured'}`);
          console.log(`user_install=${app.integration_types_config?.['1'] ? 'configured' : 'not-configured'}`);
          NODE
          mkdir -p .deploy
          cp /tmp/diag.txt .deploy/discord-activity-config.txt
          cat /tmp/diag.txt
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/discord-activity-config.txt
          git commit -m "chore(docs): record Discord Activity config [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
