name: Check Bardo Discord OAuth secret

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-bardo-secret-format.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret presence without exposing values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          npx --yes wrangler@4.124.0 secret list --format json > /tmp/secrets.json
          OAUTH=missing
          node - <<'NODE' > /tmp/names.txt
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          for (const item of Array.isArray(data) ? data : []) if (item?.name) console.log(item.name);
          NODE
          if grep -qx 'DISCORD_CLIENT_SECRET' /tmp/names.txt; then OAUTH=present; fi
          {
            echo 'status=success'
            echo "discord_client_secret=$OAUTH"
            echo 'secret_names:'
            cat /tmp/names.txt
          } > .deploy/bardo-oauth-secret-status.txt
      - name: Persist status
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-oauth-secret-status.txt
          git commit -m "chore(docs): record Discord OAuth secret status [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
