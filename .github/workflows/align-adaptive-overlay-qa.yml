name: One-shot adaptive overlay QA alignment

on:
  push:
    branches:
      - module/kanban
    paths:
      - .github/workflows/align-adaptive-overlay-qa.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: module/kanban
          fetch-depth: 0

      - name: Align surface and motion-aware QA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('prototypes/kanban-heroui')

          styles_path = root / 'src/styles.css'
          styles = styles_path.read_text()
          old = '    background: var(--surface);\n    box-shadow: 0 1px 0 var(--separator);'
          new = '    background: var(--overlay);\n    box-shadow: 0 1px 0 var(--separator);'
          if styles.count(old) != 1:
              raise SystemExit(f'Expected one header surface, found {styles.count(old)}')
          styles = styles.replace(old, new)
          old = '    background: var(--surface);\n    box-shadow: 0 -1px 0 var(--separator);'
          new = '    background: var(--overlay);\n    box-shadow: 0 -1px 0 var(--separator);'
          if styles.count(old) != 1:
              raise SystemExit(f'Expected one footer surface, found {styles.count(old)}')
          styles = styles.replace(old, new)
          styles_path.write_text(styles)

          test_path = root / 'tests/kanban.spec.ts'
          test = test_path.read_text()
          test = test.replace(
              "test('mobile: native action trigger matches HeroUI icon geometry and modal is contained'",
              "test('mobile: native action trigger matches HeroUI icon geometry and bottom sheet settles inside viewport'",
          )
          old = '''  const dialogBox = await dialog.boundingBox();
          expect(dialogBox).not.toBeNull();
          expect(dialogBox!.x).toBeGreaterThanOrEqual(0);
          expect(dialogBox!.y).toBeGreaterThanOrEqual(0);
          expect(dialogBox!.x + dialogBox!.width).toBeLessThanOrEqual((await page.viewportSize())!.width);
          expect(dialogBox!.y + dialogBox!.height).toBeLessThanOrEqual((await page.viewportSize())!.height);
          '''
          new = '''  const viewport = (await page.viewportSize())!;
          await expect.poll(async () => {
            const box = await dialog.boundingBox();
            if (!box) return false;
            return box.x >= -1
              && box.y >= -1
              && box.x + box.width <= viewport.width + 1
              && box.y + box.height <= viewport.height + 1;
          }).toBe(true);
          '''
          if old not in test:
              raise SystemExit('Legacy immediate dialog containment assertion not found')
          test = test.replace(old, new)
          test_path.write_text(test)
          PY

      - name: Commit alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototypes/kanban-heroui/src/styles.css prototypes/kanban-heroui/tests/kanban.spec.ts
          git diff --cached --check
          git commit -m "test(kanban): align QA with native Drawer motion"
          git push origin HEAD:module/kanban
