name: Deploy Bardo Docs to Cloudflare Pages

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - 'prototypes/docs-app/**'
      - '.github/workflows/deploy-bardo-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials
        id: creds
        continue-on-error: true
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install React prototype dependencies
        id: deps
        if: steps.creds.outcome == 'success'
        continue-on-error: true
        run: npm install --prefix prototypes/docs-app --no-audit --no-fund

      - name: Build React + HeroUI prototype
        id: build
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        run: npm run build --prefix prototypes/docs-app

      - name: Verify build output
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          test -f prototypes/docs-app/dist/index.html
          grep -q '<div id="root"></div>' prototypes/docs-app/dist/index.html
          test -f prototypes/docs-app/dist/_headers

      - name: Install Chromium for E2E
        id: browser
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd prototypes/docs-app
          npx playwright install --with-deps chromium

      - name: Mobile E2E regression gate
        id: e2e
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../.deploy
          cd prototypes/docs-app
          npm run test:e2e 2>&1 | tee ../../.deploy/bardo-docs-e2e.log

      - name: Ensure Pages project exists
        id: pages
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages project create bardo-docs --production-branch module/bardo-docs || true

      - name: Deploy React prototype
        id: deploy
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages deploy prototypes/docs-app/dist \
            --project-name bardo-docs \
            --branch module/bardo-docs \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Bardo Docs React + HeroUI prototype"

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          CREDS_OUTCOME: ${{ steps.creds.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          mkdir -p .deploy
          STATUS=failure
          if [ "$DEPLOY_OUTCOME" = "success" ]; then STATUS=success; fi
          cat > .deploy/bardo-docs-status.txt <<EOF
          status=$STATUS
          url=https://bardo-docs.pages.dev
          branch=module/bardo-docs
          stack=react-vite-heroui
          qa=playwright-mobile
          creds=$CREDS_OUTCOME
          deps=$DEPS_OUTCOME
          build=$BUILD_OUTCOME
          verify=$VERIFY_OUTCOME
          browser=$BROWSER_OUTCOME
          e2e=$E2E_OUTCOME
          deploy=$DEPLOY_OUTCOME
          source_commit=$GITHUB_SHA
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-docs-status.txt
          if [ -f .deploy/bardo-docs-e2e.log ]; then git add .deploy/bardo-docs-e2e.log; fi
          git commit -m "chore(docs): record Pages deployment diagnostics" || true
          git push origin HEAD:module/bardo-docs || true
          test "$STATUS" = "success"
