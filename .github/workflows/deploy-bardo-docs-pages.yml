name: Deploy Bardo Docs to Cloudflare Pages

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - 'prototypes/docs/**'
      - '.github/workflows/deploy-bardo-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Ensure Pages project exists
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages project create bardo-docs --production-branch module/bardo-docs || true

      - name: Deploy prototype
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages deploy prototypes/docs \
            --project-name bardo-docs \
            --branch module/bardo-docs \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Bardo Docs functional prototype"

      - name: Record successful deployment
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-docs-status.txt <<EOF
          status=success
          url=https://bardo-docs.pages.dev
          branch=module/bardo-docs
          source_commit=$GITHUB_SHA
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-docs-status.txt
          git commit -m "chore(docs): record Cloudflare Pages deployment" || exit 0
          git push origin HEAD:module/bardo-docs
