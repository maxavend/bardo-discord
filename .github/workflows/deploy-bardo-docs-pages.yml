name: Deploy Bardo Docs to Cloudflare Pages

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - 'prototypes/docs-app/**'
      - '.github/workflows/deploy-bardo-docs-pages.yml'
  workflow_dispatch:

concurrency:
  group: bardo-docs-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEROUI_SOURCE_SHA: 1d2164e7b9a60221e39501081f0fe4f6c564bccf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials
        id: creds
        continue-on-error: true
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install React prototype dependencies
        id: deps
        if: steps.creds.outcome == 'success'
        continue-on-error: true
        run: npm install --prefix prototypes/docs-app --no-audit --no-fund

      - name: Generate exact HeroUI Theme Builder CSS
        id: theme
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/heroui-inc/heroui/${HEROUI_SOURCE_SHA}/apps/docs/src/app/%5Blang%5D/themes/utils/generate-theme-colors.ts" -o /tmp/generate-theme-colors.ts
          npx --yes tsx@4.20.6 prototypes/docs-app/scripts/generate-heroui-theme.mjs /tmp/generate-theme-colors.ts prototypes/docs-app/src/theme.css
          grep -q -- '--accent: oklch(57.74% 0.2091 273.85);' prototypes/docs-app/src/theme.css
          grep -q -- '--radius: 0.25rem;' prototypes/docs-app/src/theme.css
          grep -q -- '--field-radius: 0.75rem;' prototypes/docs-app/src/theme.css
          grep -q -- '--field-border: transparent;' prototypes/docs-app/src/theme.css

      - name: Lint audited application
        id: lint
        if: steps.theme.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .deploy
          npm run lint --prefix prototypes/docs-app 2>&1 | tee .deploy/bardo-docs-lint.log

      - name: Typecheck audited application
        id: typecheck
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .deploy
          npm run typecheck --prefix prototypes/docs-app 2>&1 | tee .deploy/bardo-docs-typecheck.log

      - name: Build React + HeroUI prototype
        id: build
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .deploy
          npm run build --prefix prototypes/docs-app 2>&1 | tee .deploy/bardo-docs-build.log

      - name: Verify build and semantic source output
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f prototypes/docs-app/dist/index.html
          grep -q '<div id="root"></div>' prototypes/docs-app/dist/index.html
          test -f prototypes/docs-app/dist/_headers
          test -f prototypes/docs-app/src/App.jsx
          grep -q 'SearchField.Group' prototypes/docs-app/src/App.jsx
          grep -q '<Toolbar isAttached' prototypes/docs-app/src/App.jsx
          grep -q '<TextField className="modal-field">' prototypes/docs-app/src/App.jsx
          grep -q '<ToastProvider placement="bottom"' prototypes/docs-app/src/App.jsx
          ! grep -q 'search-wrap' prototypes/docs-app/src/App.jsx
          ! grep -Eq '#[0-9a-fA-F]{3,8}|rgb\(|hsl\(|oklch\(' prototypes/docs-app/src/styles.source.css
          ! grep -q '!important' prototypes/docs-app/src/styles.source.css

      - name: Install Chromium for responsive E2E
        id: browser
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          cd prototypes/docs-app
          npx playwright install --with-deps chromium

      - name: Full responsive and functional E2E gate
        id: e2e
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../.deploy
          cd prototypes/docs-app
          npm run test:e2e 2>&1 | tee ../../.deploy/bardo-docs-e2e.log

      - name: Ensure Pages project exists
        id: pages
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages project create bardo-docs --production-branch module/bardo-docs || true

      - name: Deploy audited React prototype
        id: deploy
        if: steps.e2e.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages deploy prototypes/docs-app/dist \
            --project-name bardo-docs \
            --branch module/bardo-docs \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Bardo Docs HeroUI visual audit"

      - name: Record audit and deployment diagnostics
        if: always()
        shell: bash
        env:
          CREDS_OUTCOME: ${{ steps.creds.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          THEME_OUTCOME: ${{ steps.theme.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          mkdir -p .deploy
          STATUS=failure
          if [ "$DEPLOY_OUTCOME" = "success" ]; then STATUS=success; fi
          cat > .deploy/bardo-docs-status.txt <<EOF
          status=$STATUS
          url=https://bardo-docs.pages.dev
          branch=module/bardo-docs
          stack=react-vite-heroui
          theme=lightness:0.5774,chroma:0.2091,hue:273.85,base:0.01,radius:small,formRadius:large
          heroui_source=$HEROUI_SOURCE_SHA
          creds=$CREDS_OUTCOME
          deps=$DEPS_OUTCOME
          theme_generation=$THEME_OUTCOME
          lint=$LINT_OUTCOME
          typecheck=$TYPECHECK_OUTCOME
          build=$BUILD_OUTCOME
          verify=$VERIFY_OUTCOME
          browser=$BROWSER_OUTCOME
          e2e=$E2E_OUTCOME
          deploy=$DEPLOY_OUTCOME
          source_commit=$GITHUB_SHA
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-docs-status.txt prototypes/docs-app/src/theme.css
          for log in .deploy/bardo-docs-lint.log .deploy/bardo-docs-typecheck.log .deploy/bardo-docs-build.log .deploy/bardo-docs-e2e.log; do
            if [ -f "$log" ]; then git add "$log"; fi
          done
          git commit -m "chore(docs): record audited Pages result [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
          test "$STATUS" = "success"
