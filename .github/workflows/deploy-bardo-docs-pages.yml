name: Deploy Bardo Docs to Cloudflare Pages

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - 'prototypes/docs/**'
      - '.github/workflows/deploy-bardo-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Ensure Pages project exists
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages project create bardo-docs --production-branch module/bardo-docs || true

      - name: Deploy prototype
        shell: bash
        run: |
          npx --yes wrangler@4.124.0 pages deploy prototypes/docs \
            --project-name bardo-docs \
            --branch module/bardo-docs \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Bardo Docs functional prototype"
