name: Diagnose Bardo production D1 access

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-bardo-d1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Inspect production D1 legacy access
        id: d1
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 d1 execute db89af73-dc24-491e-bf57-975f7bd6c085 --remote --command "SELECT COUNT(*) AS total_docs FROM documents WHERE archived_at IS NULL; SELECT COUNT(*) AS access_rows FROM document_guild_access; SELECT COUNT(*) AS legacy_unscoped FROM documents d WHERE d.archived_at IS NULL AND NOT EXISTS (SELECT 1 FROM document_guild_access a WHERE a.document_id = d.id); SELECT guild_id, COUNT(*) AS access_count FROM document_guild_access GROUP BY guild_id ORDER BY access_count DESC; SELECT guild_id, COUNT(*) AS session_count FROM docs_sessions GROUP BY guild_id ORDER BY session_count DESC; SELECT guild_id, COUNT(*) AS launch_count FROM docs_launch_intents GROUP BY guild_id ORDER BY launch_count DESC;" --json 2>&1 | tee /tmp/d1.log

      - name: Record diagnostics
        if: always()
        shell: bash
        env:
          D1: ${{ steps.d1.outcome }}
        run: |
          mkdir -p .deploy
          {
            echo "status=$D1"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- legacy-access-diagnostic ---"
            cat /tmp/d1.log 2>/dev/null || true
          } > .deploy/bardo-legacy-docs-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-legacy-docs-diagnostic.txt
          git commit -m "chore(docs): record legacy document access diagnostic [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
          test "$D1" = "success"
