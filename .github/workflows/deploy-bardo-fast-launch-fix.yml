name: Deploy Bardo fast Activity launch fix

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/deploy-bardo-fast-launch-fix.yml'
  workflow_dispatch:

concurrency:
  group: deploy-bardo-fast-launch-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply production Worker patches
        run: |
          node scripts/apply-production-worker.mjs src/worker.js
          node scripts/apply-inline-activity-launch.mjs src/worker.js
          node scripts/apply-activity-diagnostic-route.mjs src/worker.js
          grep -q "return jsonResponse({ type: 12 });" src/worker.js
          grep -q "ctx.waitUntil(persistLaunchContext())" src/worker.js
          grep -q "__bardo_diag_activity_20260823" src/worker.js
          if grep -q "callback?with_response=true" src/worker.js; then
            echo "Remote interaction callback still present" >&2
            exit 1
          fi
          node --check src/worker.js

      - name: Run tests
        run: npm test

      - name: Deploy Worker
        run: npx --yes wrangler@4.124.0 deploy --keep-vars

      - name: Verify live origin
        run: |
          set -euo pipefail
          curl -fsSL -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?inline-launch=$GITHUB_SHA" -o /tmp/live.html
          grep -q 'docs-current-document-only-v1' /tmp/live.html
          curl -fsSL "$WORKER_ORIGIN/__bardo_diag_activity_20260823" -o /tmp/activity-config.json
          grep -q 'inline-launch-diag-v1' /tmp/activity-config.json

      - name: Record status
        if: always()
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-fast-launch-status.txt <<EOF
          source_commit=$GITHUB_SHA
          inline_launch=true
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          if [ -f /tmp/activity-config.json ]; then
            cp /tmp/activity-config.json .deploy/discord-activity-runtime.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-fast-launch-status.txt .deploy/discord-activity-runtime.json 2>/dev/null || git add .deploy/bardo-fast-launch-status.txt
          git commit -m "chore(docs): record Activity runtime diagnostic [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
