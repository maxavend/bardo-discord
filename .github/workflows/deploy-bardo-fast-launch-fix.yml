name: Deploy Bardo fast Activity launch fix

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/deploy-bardo-fast-launch-fix.yml'
  workflow_dispatch:

concurrency:
  group: deploy-bardo-fast-launch-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Apply production Worker patches
        id: patch
        continue-on-error: true
        run: |
          node scripts/apply-production-worker.mjs src/worker.js
          node scripts/apply-inline-activity-launch.mjs src/worker.js
          node scripts/apply-activity-diagnostic-route.mjs src/worker.js
          grep -q "return jsonResponse({ type: 12 });" src/worker.js
          grep -q "ctx.waitUntil(persistLaunchContext())" src/worker.js
          grep -q "__bardo_diag_activity_20260823" src/worker.js
          if grep -q "callback?with_response=true" src/worker.js; then
            echo "Remote interaction callback still present" >&2
            exit 1
          fi
          node --check src/worker.js

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Deploy Worker
        id: deploy_worker
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 deploy --keep-vars 2>&1 | tee /tmp/deploy.log

      - name: Capture live Activity diagnostic
        id: runtime
        if: always()
        shell: bash
        run: |
          set +e
          curl -sS -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?inline-launch=$GITHUB_SHA" -o /tmp/live.html
          LIVE_CURL=$?
          HTTP_CODE=$(curl -sS -o /tmp/activity-config.json -w '%{http_code}' "$WORKER_ORIGIN/__bardo_diag_activity_20260823")
          DIAG_CURL=$?
          {
            echo "live_curl=$LIVE_CURL"
            echo "diag_curl=$DIAG_CURL"
            echo "diag_http=$HTTP_CODE"
            echo "--- body ---"
            cat /tmp/activity-config.json 2>/dev/null || true
          } > /tmp/activity-runtime.txt
          cat /tmp/activity-runtime.txt
          exit 0

      - name: Record status
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DEPLOY: ${{ steps.deploy_worker.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-fast-launch-status.txt <<EOF
          source_commit=$GITHUB_SHA
          inline_launch=true
          deps=$DEPS
          patch=$PATCH
          tests=$TESTS
          deploy=$DEPLOY
          runtime=$RUNTIME
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          if [ -f /tmp/activity-runtime.txt ]; then
            cp /tmp/activity-runtime.txt .deploy/discord-activity-runtime.txt
          fi
          if [ -f /tmp/deploy.log ]; then
            tail -n 120 /tmp/deploy.log > .deploy/bardo-fast-launch-deploy.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-fast-launch-status.txt
          [ ! -f .deploy/discord-activity-runtime.txt ] || git add .deploy/discord-activity-runtime.txt
          [ ! -f .deploy/bardo-fast-launch-deploy.log ] || git add .deploy/bardo-fast-launch-deploy.log
          git commit -m "chore(docs): record deploy diagnostics [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
