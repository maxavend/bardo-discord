name: Diagnose Bardo Docs D1 migration

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-bardo-docs-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect migration state without writes
        shell: bash
        run: |
          set +e
          mkdir -p .deploy
          {
            echo '--- migrations list ---'
            npx --yes wrangler@4.124.0 d1 migrations list bardo-db --remote 2>&1
            echo
            echo '--- documents schema ---'
            npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "PRAGMA table_info(documents);" --json 2>&1
            echo
            echo '--- indexes ---'
            npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "PRAGMA index_list(documents);" --json 2>&1
            echo
            echo '--- migration table ---'
            npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%migration%';" --json 2>&1
          } > .deploy/bardo-migration-diagnostic.txt
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-migration-diagnostic.txt
          git commit -m "chore(docs): record D1 migration diagnostic [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true

