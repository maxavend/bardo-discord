name: One-shot Bardo restore

on:
  pull_request_target:
    types:
      - ready_for_review

permissions:
  contents: read
  statuses: write

jobs:
  restore:
    if: github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restored Bardo commit
        uses: actions/checkout@v4
        with:
          ref: 132ec2eb403dc5e162273316abdb29cff4c70e4c

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate restored version
        run: |
          npm run check
          npm test

      - name: Check deployment credentials
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          missing=0
          post_secret_status() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              state=success
              desc="$name is present"
            else
              state=failure
              desc="$name is missing"
              missing=1
            fi
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${REPORT_SHA}" \
              -d "$(jq -nc --arg s "$state" --arg c "restore/secret/$name" --arg d "$desc" '{state:$s,context:$c,description:$d}')"
          }
          post_secret_status CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          post_secret_status CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          post_secret_status DISCORD_TOKEN "$DISCORD_TOKEN"
          post_secret_status DISCORD_GUILD_ID "$DISCORD_GUILD_ID"
          if [ "$missing" -ne 0 ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${REPORT_SHA}" \
              -d '{"state":"failure","context":"restore/credentials","description":"One or more deployment secrets are missing"}'
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${REPORT_SHA}" \
            -d '{"state":"success","context":"restore/credentials","description":"All deployment secrets are present"}'

      - name: Deploy restored Worker and Activity to Cloudflare
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler deploy; then
            state=success
            desc="Cloudflare production deploy succeeded"
          else
            state=failure
            desc="Cloudflare production deploy failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${REPORT_SHA}" \
            -d "$(jq -nc --arg s "$state" --arg d "$desc" '{state:$s,context:"restore/cloudflare",description:$d}')"
          [ "$state" = success ]

      - name: Restore Discord slash commands
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.sha }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          if node scripts/register-commands.js; then
            state=success
            desc="Discord commands restored: doc, tablero, tarea"
          else
            state=failure
            desc="Discord command registration failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${REPORT_SHA}" \
            -d "$(jq -nc --arg s "$state" --arg d "$desc" '{state:$s,context:"restore/discord",description:$d}')"
          [ "$state" = success ]
