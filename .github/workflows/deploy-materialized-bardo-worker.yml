name: Deploy materialized Bardo Worker

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/deploy-materialized-bardo-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-materialized-bardo-worker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Verify materialized Worker
        id: verify
        continue-on-error: true
        run: |
          grep -q "async function handleComponentInteraction(interaction, env, ctx)" src/worker.js
          grep -q "return handleComponentInteraction(interaction, env, ctx);" src/worker.js
          grep -q "return jsonResponse({ type: 12 });" src/worker.js
          grep -q "ctx.waitUntil(persistLaunchContext())" src/worker.js
          grep -q "handleDiscordAuthApi" src/worker.js
          grep -q "handleDocsApi" src/worker.js
          if grep -q "callback?with_response=true" src/worker.js; then
            echo "Legacy remote callback present" >&2
            exit 1
          fi
          node --check src/worker.js

      - name: Add temporary Activity configuration diagnostic
        id: diagpatch
        continue-on-error: true
        run: |
          node scripts/apply-activity-diagnostic-route.mjs src/worker.js
          grep -q '__bardo_diag_activity_20260823' src/worker.js
          node --check src/worker.js

      - name: Test Worker
        id: tests
        continue-on-error: true
        run: npm test

      - name: Build current Docs Activity
        id: build
        continue-on-error: true
        run: |
          npm install --prefix prototypes/docs-app --no-audit --no-fund
          npm run build --prefix prototypes/docs-app
          rm -rf activity
          mkdir -p activity
          cp -R prototypes/docs-app/dist/. activity/
          test -f activity/index.html
          grep -q 'docs-current-document-only-v1' activity/index.html

      - name: Deploy exactly materialized Worker plus diagnostic
        id: deploy_worker
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 deploy --keep-vars 2>&1 | tee /tmp/wrangler-deploy.log

      - name: Probe live origin and Discord application configuration
        id: runtime
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LIVE_HTTP=$(curl -sS -o /tmp/live.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?materialized=$GITHUB_SHA")
          LIVE_CURL=$?
          DIAG_HTTP=$(curl -sS -o /tmp/discord-app.json -w '%{http_code}' "$WORKER_ORIGIN/__bardo_diag_activity_20260823")
          DIAG_CURL=$?
          {
            echo "live_curl=$LIVE_CURL"
            echo "live_http=$LIVE_HTTP"
            echo "live_marker=$(grep -c 'docs-current-document-only-v1' /tmp/live.html 2>/dev/null || true)"
            echo "diag_curl=$DIAG_CURL"
            echo "diag_http=$DIAG_HTTP"
            echo "--- discord_app ---"
            cat /tmp/discord-app.json 2>/dev/null || true
          } > /tmp/runtime.txt
          cat /tmp/runtime.txt
          exit 0

      - name: Record exact deployment state
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          DIAGPATCH: ${{ steps.diagpatch.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DEPLOY: ${{ steps.deploy_worker.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-materialized-worker-status.txt <<EOF
          source_commit=$GITHUB_SHA
          deps=$DEPS
          verify=$VERIFY
          diagnostic_patch=$DIAGPATCH
          tests=$TESTS
          build=$BUILD
          deploy=$DEPLOY
          runtime=$RUNTIME
          materialized_worker=true
          inline_launch=true
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          if [ -f /tmp/runtime.txt ]; then cp /tmp/runtime.txt .deploy/discord-activity-runtime.txt; fi
          if [ -f /tmp/wrangler-deploy.log ]; then tail -n 100 /tmp/wrangler-deploy.log > .deploy/materialized-wrangler-deploy.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-materialized-worker-status.txt
          [ ! -f .deploy/discord-activity-runtime.txt ] || git add .deploy/discord-activity-runtime.txt
          [ ! -f .deploy/materialized-wrangler-deploy.log ] || git add .deploy/materialized-wrangler-deploy.log
          git commit -m "chore(docs): record exact Activity deploy state [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
