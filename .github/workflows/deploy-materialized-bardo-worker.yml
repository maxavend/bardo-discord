name: Deploy materialized Bardo Worker

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/deploy-materialized-bardo-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-materialized-bardo-worker
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify materialized Worker
        run: |
          grep -q "async function handleComponentInteraction(interaction, env, ctx)" src/worker.js
          grep -q "return handleComponentInteraction(interaction, env, ctx);" src/worker.js
          grep -q "return jsonResponse({ type: 12 });" src/worker.js
          grep -q "ctx.waitUntil(persistLaunchContext())" src/worker.js
          grep -q "handleDiscordAuthApi" src/worker.js
          grep -q "handleDocsApi" src/worker.js
          if grep -q "callback?with_response=true" src/worker.js; then
            echo "Legacy remote callback present" >&2
            exit 1
          fi
          node --check src/worker.js

      - name: Test Worker
        run: npm test

      - name: Build current Docs Activity
        run: |
          npm install --prefix prototypes/docs-app --no-audit --no-fund
          npm run build --prefix prototypes/docs-app
          rm -rf activity
          mkdir -p activity
          cp -R prototypes/docs-app/dist/. activity/
          test -f activity/index.html
          grep -q 'docs-current-document-only-v1' activity/index.html

      - name: Deploy exactly materialized Worker
        run: npx --yes wrangler@4.124.0 deploy --keep-vars

      - name: Verify live origin
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?materialized=$GITHUB_SHA&attempt=$attempt" -o /tmp/live.html && grep -q 'docs-current-document-only-v1' /tmp/live.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Record deterministic deploy
        if: always()
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-materialized-worker-status.txt <<EOF
          source_commit=$GITHUB_SHA
          materialized_worker=true
          inline_launch=true
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-materialized-worker-status.txt
          git commit -m "chore(docs): record materialized Worker deploy [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
