name: Diagnose live Bardo Activity origin

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-live-bardo-origin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Worker and Discord Activity proxy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          TS=$(date +%s)
          WORKER_URL="https://bardo-discord.bardo-discord.workers.dev/?diagnostic=$TS"
          DISCORD_URL="https://1539704001535156254.discordsays.com/?diagnostic=$TS"

          WORKER_HTTP=$(curl -sS -L -o /tmp/worker.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$WORKER_URL" || true)
          DISCORD_HTTP=$(curl -sS -L -o /tmp/discord.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$DISCORD_URL" || true)

          marker() {
            if grep -q 'docs-current-document-only-v1' "$1" 2>/dev/null; then echo present; else echo missing; fi
          }
          context_fix() {
            if grep -q 'discord-context-retry-v1' "$1" 2>/dev/null; then echo present; else echo missing; fi
          }
          launch_fix() {
            if grep -q 'discord-custom-id-session-v2' "$1" 2>/dev/null; then echo present; else echo missing; fi
          }
          title() { grep -o '<title>[^<]*</title>' "$1" 2>/dev/null | head -1 || true; }
          script() { grep -o '<script[^>]*src="[^"]*"[^>]*>' "$1" 2>/dev/null | head -1 || true; }

          {
            echo "expected_marker=docs-current-document-only-v1"
            echo "expected_context_fix=discord-context-retry-v1"
            echo "expected_launch_fix=discord-custom-id-session-v2"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '--- worker-origin ---'
            echo "url=$WORKER_URL"
            echo "http=$WORKER_HTTP"
            echo "marker=$(marker /tmp/worker.html)"
            echo "context_fix=$(context_fix /tmp/worker.html)"
            echo "launch_fix=$(launch_fix /tmp/worker.html)"
            echo "title=$(title /tmp/worker.html)"
            echo "script=$(script /tmp/worker.html)"
            echo
            echo '--- discord-proxy ---'
            echo "url=$DISCORD_URL"
            echo "http=$DISCORD_HTTP"
            echo "marker=$(marker /tmp/discord.html)"
            echo "context_fix=$(context_fix /tmp/discord.html)"
            echo "launch_fix=$(launch_fix /tmp/discord.html)"
            echo "title=$(title /tmp/discord.html)"
            echo "script=$(script /tmp/discord.html)"
            echo
            echo '--- discord-html-head ---'
            sed -n '1,55p' /tmp/discord.html 2>/dev/null || true
          } > .deploy/bardo-live-origin.txt
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+maxavend@users.noreply.github.com"
          git add .deploy/bardo-live-origin.txt
          git commit -m "chore(docs): record Worker and Discord Activity proxy diagnostic [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true

# Recheck after deploying discord-custom-id-session-v2.
