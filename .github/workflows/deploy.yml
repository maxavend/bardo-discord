name: Deploy Bardo Docs

on:
  push:
    branches:
      - module/bardo-docs
      - main
  workflow_dispatch:

concurrency:
  group: bardo-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare (D1 & Worker)
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix activity-app --no-audit --no-fund

      - name: Syntax and integrity check
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Build Activity frontend
        run: npm run build

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply bardo-db --remote

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --keep-vars

      - name: Verify live Worker health
        run: |
          echo "Verificando Worker en $WORKER_ORIGIN..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WORKER_ORIGIN/")
          echo "Worker root respondió con HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 405 ]; then
            echo "Health check falló: status inesperado $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Deploy verificado y saludable."
