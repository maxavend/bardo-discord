name: Validate Bardo Docs guild auth

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/validate-bardo-docs-guild-auth.yml'
      - 'src/**'
      - 'scripts/apply-production-worker.mjs'
      - 'prototypes/docs-app/**'
      - 'migrations/0005_docs_guild_auth.sql'
      - 'migrations/0006_docs_launch_intents.sql'
  workflow_dispatch:

concurrency:
  group: validate-bardo-docs-guild-auth
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HEROUI_SOURCE_SHA: 1d2164e7b9a60221e39501081f0fe4f6c564bccf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and test bot
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Validate production Worker assembly
        run: |
          node --check src/db.js
          node --check src/discord-auth.js
          node --check src/docs-api.js
          node --check scripts/apply-production-worker.mjs
          node scripts/apply-production-worker.mjs src/worker.js
          node --check src/worker.js
          grep -q "grantDocumentGuildAccess" src/worker.js
          grep -q "saveDocsLaunchIntent" src/worker.js
          grep -q "handleDiscordAuthApi" src/worker.js

      - name: Install Docs dependencies
        run: npm install --prefix prototypes/docs-app --no-audit --no-fund

      - name: Generate exact HeroUI theme
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/heroui-inc/heroui/${HEROUI_SOURCE_SHA}/apps/docs/src/app/%5Blang%5D/themes/utils/generate-theme-colors.ts" -o /tmp/generate-theme-colors.ts
          npx --yes tsx@4.20.6 prototypes/docs-app/scripts/generate-heroui-theme.mjs /tmp/generate-theme-colors.ts prototypes/docs-app/src/theme.css

      - name: Build authenticated Docs Activity
        run: npm run build --prefix prototypes/docs-app

      - name: Verify auth contract in compiled Activity
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q "/api/auth/token" prototypes/docs-app/dist/assets
          grep -R -q "bardo_token" prototypes/docs-app/dist/assets
          grep -R -q "identify" prototypes/docs-app/dist/assets
          grep -R -q "guilds" prototypes/docs-app/dist/assets
          grep -R -q "Authorization" prototypes/docs-app/dist/assets

      - name: Record validation
        if: success()
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-guild-auth-validation.txt <<EOF
          status=success
          architecture=discord-guild-auth-v1
          oauth=compiled
          guild_acl=compiled
          signed_launch_intent=compiled
          tests=success
          docs_build=success
          source_commit=$GITHUB_SHA
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-guild-auth-validation.txt prototypes/docs-app/src/theme.css
          git commit -m "chore(docs): record guild auth validation [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
