name: Diagnose Bardo Discord secret names

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-bardo-discord-secrets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: List Worker secret names only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          npx --yes wrangler@4.124.0 secret list --json > /tmp/secrets.json
          node - <<'NODE' > .deploy/bardo-discord-secret-names.txt
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          const names = (Array.isArray(data) ? data : []).map(x => x.name).filter(Boolean).sort();
          console.log('status=success');
          for (const name of names) console.log(`secret=${name}`);
          NODE
      - name: Persist names
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-discord-secret-names.txt
          git commit -m "chore(docs): record Discord Worker secret names [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
