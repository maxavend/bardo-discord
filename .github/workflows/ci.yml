name: CI

on:
  push:
    branches: ['main', 'module/bardo-docs', 'feat/**']
  pull_request:
    branches: ['main', 'module/bardo-docs']

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix activity-app --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm --prefix activity-app run typecheck

      - name: Build
        run: npm run build

      - name: Syntax check
        run: |
          node --check src/worker.js
          node --check src/components.js
          node --check src/document-id.js
          node --check src/export-format.js
          node --check src/import-format.js
          node --check src/pagination.js
          node --check src/db.js
          node --check src/discord-auth.js
          node --check src/discord-permissions.js
          node --check src/document-access.js
          node --check src/docs-api.js
          node --check src/planner-api.js
          node --check src/limits.js
          node --check scripts/register-commands.js
          node --check scripts/command-definitions.js
          node --check scripts/build-activity.js

      # Replays every D1 migration on a fresh SQLite (node:sqlite) and checks
      # that all SQL in src/ compiles against the final schema. Catches
      # migrations that reference columns no migration creates.
      - name: Migrations replay (fresh database)
        run: node --test test/schema.test.js

      - name: Test
        run: npm test

      # E2E de la Activity con Playwright (solo Chromium, 3 vistas representativas).
      # `npm test` ya construyó la Activity en ./activity, que `vite preview` sirve.
      - name: Install Playwright Chromium
        working-directory: activity-app
        run: npx playwright install --with-deps chromium

      - name: E2E (laptop, mobile-narrow, mobile-standard)
        working-directory: activity-app
        timeout-minutes: 8
        run: npm run test:e2e:ci

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-test-results
          path: activity-app/test-results/
          retention-days: 7
          if-no-files-found: ignore
