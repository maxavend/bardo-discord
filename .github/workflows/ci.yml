name: CI

on:
  push:
    branches: ['main', 'feat/**', 'codex/**']
  pull_request:
    branches: ['main', 'feat/bardo-unified-experience']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and static checks
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Worker integration tests
        run: npm run test:worker

      - name: E2E gate
        run: npm run test:e2e

      - name: Accessibility gate
        run: npm run test:a11y
