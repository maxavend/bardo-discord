name: CI

on:
  push:
    branches: ['main', 'feat/**', 'codex/**']
  pull_request:
    branches: ['main', 'feat/bardo-unified-experience']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh lockfile security fixes
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Persist lockfile security fixes
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/p7-release-hardening'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- package-lock.json
            git commit -m 'chore(deps): persist audited lockfile'
            git push origin HEAD:codex/p7-release-hardening
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build and static checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Worker integration tests
        run: npm run test:worker
      - name: E2E gate
        run: npm run test:e2e
      - name: Accessibility gate
        run: npm run test:a11y
      - name: Visual regression evidence
        run: npm run test:visual
      - name: Dependency audit evidence
        run: npm run audit:release
      - name: Release readiness evidence
        run: npm run check:release
      - name: Upload Phase 3 UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-ui-evidence
          path: .artifacts/ui
          if-no-files-found: warn
      - name: Upload Phase 6 performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-performance-evidence
          path: |
            .artifacts/activity-build.json
            .artifacts/activity-build.txt
            .artifacts/environment-isolation.json
          if-no-files-found: error
      - name: Upload Phase 7 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-release-evidence
          path: .artifacts/release
          if-no-files-found: error
