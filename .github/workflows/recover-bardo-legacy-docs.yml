name: Recover Bardo legacy documents

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/recover-bardo-legacy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the sole known Discord guild
        id: guild
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT guild_id FROM (SELECT guild_id FROM document_guild_access UNION SELECT guild_id FROM docs_sessions UNION SELECT guild_id FROM docs_launch_intents) WHERE guild_id IS NOT NULL AND guild_id <> '' ORDER BY guild_id;" --json > /tmp/guilds.json
          node - <<'NODE' > /tmp/guild.txt
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/guilds.json','utf8'));
          const rows = (Array.isArray(data) ? data : [data]).flatMap(x => x.results || []);
          const guilds = [...new Set(rows.map(x => String(x.guild_id || '').trim()).filter(Boolean))];
          if (guilds.length !== 1) {
            console.error(`Refusing legacy recovery: expected exactly one known guild, found ${guilds.length}.`);
            process.exit(2);
          }
          if (!/^\d+$/.test(guilds[0])) {
            console.error('Refusing legacy recovery: guild id is not numeric.');
            process.exit(3);
          }
          process.stdout.write(guilds[0]);
          NODE
          GUILD_ID=$(cat /tmp/guild.txt)
          echo "guild_id=$GUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Count unscoped legacy documents
        id: before
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT COUNT(*) AS count FROM documents d WHERE d.archived_at IS NULL AND NOT EXISTS (SELECT 1 FROM document_guild_access a WHERE a.document_id = d.id);" --json > /tmp/before.json
          COUNT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/before.json','utf8'));const a=Array.isArray(x)?x:[x];const r=a.flatMap(v=>v.results||[]).find(v=>v.count!==undefined); if(!r)process.exit(2); process.stdout.write(String(r.count));")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Legacy documents without guild access: $COUNT"

      - name: Backfill legacy documents into the sole guild
        if: steps.before.outputs.count != '0'
        shell: bash
        env:
          GUILD_ID: ${{ steps.guild.outputs.guild_id }}
        run: |
          set -euo pipefail
          case "$GUILD_ID" in (*[!0-9]*|'') echo 'Invalid guild id' >&2; exit 2;; esac
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "INSERT INTO document_guild_access (document_id, guild_id, added_at, added_by) SELECT d.id, '$GUILD_ID', datetime('now'), 'legacy-recovery' FROM documents d WHERE d.archived_at IS NULL AND NOT EXISTS (SELECT 1 FROM document_guild_access a WHERE a.document_id = d.id);"

      - name: Verify recovery
        id: after
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT COUNT(*) AS count FROM documents d WHERE d.archived_at IS NULL AND NOT EXISTS (SELECT 1 FROM document_guild_access a WHERE a.document_id = d.id);" --json > /tmp/after.json
          COUNT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/after.json','utf8'));const a=Array.isArray(x)?x:[x];const r=a.flatMap(v=>v.results||[]).find(v=>v.count!==undefined); if(!r)process.exit(2); process.stdout.write(String(r.count));")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          test "$COUNT" = "0"

      - name: Record recovery status
        if: always()
        shell: bash
        env:
          GUILD_OUTCOME: ${{ steps.guild.outcome }}
          BEFORE: ${{ steps.before.outputs.count }}
          AFTER: ${{ steps.after.outputs.count }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          STATUS=failure
          if [ "$GUILD_OUTCOME" = success ] && [ "${AFTER:-unknown}" = "0" ]; then STATUS=success; fi
          INSERTED=unknown
          if [[ "${BEFORE:-}" =~ ^[0-9]+$ ]] && [[ "${AFTER:-}" =~ ^[0-9]+$ ]]; then INSERTED=$((BEFORE-AFTER)); fi
          cat > .deploy/bardo-legacy-docs-recovery.txt <<EOF
          status=$STATUS
          sole_guild_check=$GUILD_OUTCOME
          legacy_before=${BEFORE:-unknown}
          legacy_after=${AFTER:-unknown}
          recovered=$INSERTED
          source_commit=$GITHUB_SHA
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-legacy-docs-recovery.txt
          git commit -m "chore(docs): record legacy recovery [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
          test "$STATUS" = success
