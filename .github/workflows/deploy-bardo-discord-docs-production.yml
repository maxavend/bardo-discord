name: Deploy finalized Bardo Docs to Discord

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - 'src/**'
      - 'migrations/**'
      - 'scripts/apply-production-worker.mjs'
      - 'prototypes/docs-app/**'
      - '.github/workflows/deploy-bardo-discord-docs-production.yml'
  workflow_dispatch:

concurrency:
  group: bardo-discord-docs-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEROUI_SOURCE_SHA: 1d2164e7b9a60221e39501081f0fe4f6c564bccf
      EXPECTED_ACTIVITY_BUILD: docs-current-document-only-v1
      EXPECTED_AUTH_BUILD: discord-guild-auth-v1
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare credentials
        id: creds
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Verify Discord OAuth secret exists on Worker
        id: oauthsecret
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 secret list --json > /tmp/worker-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/worker-secrets.json','utf8'));
          const names = new Set((Array.isArray(data) ? data : []).map(item => item.name));
          if (!names.has('DISCORD_CLIENT_SECRET')) {
            console.error('Missing Worker secret: DISCORD_CLIENT_SECRET');
            process.exit(1);
          }
          console.log('DISCORD_CLIENT_SECRET is configured.');
          NODE

      - name: Install Bardo dependencies
        id: rootdeps
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Run existing bot tests before integration build
        id: tests
        continue-on-error: true
        run: npm test

      - name: Verify production modules
        id: modules
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node --check src/db.js
          node --check src/discord-auth.js
          node --check src/docs-api.js
          node --check scripts/apply-production-worker.mjs

      - name: Patch production Worker with authenticated Docs
        id: patch
        continue-on-error: true
        run: node scripts/apply-production-worker.mjs src/worker.js

      - name: Verify Discord and guild contracts remain wired
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q "commandName === 'doc' || commandName === 'documento'" src/worker.js
          grep -q "BARDO_OPEN_PREFIX" src/worker.js
          grep -q "handleDocsApi" src/worker.js
          grep -q "handleDiscordAuthApi" src/worker.js
          grep -q "grantDocumentGuildAccess" src/worker.js
          grep -q "saveDocsLaunchIntent" src/worker.js
          node --check src/worker.js

      - name: Install finalized Docs app dependencies
        id: docsdeps
        continue-on-error: true
        run: npm install --prefix prototypes/docs-app --no-audit --no-fund

      - name: Generate exact HeroUI theme
        id: theme
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/heroui-inc/heroui/${HEROUI_SOURCE_SHA}/apps/docs/src/app/%5Blang%5D/themes/utils/generate-theme-colors.ts" -o /tmp/generate-theme-colors.ts
          npx --yes tsx@4.20.6 prototypes/docs-app/scripts/generate-heroui-theme.mjs /tmp/generate-theme-colors.ts prototypes/docs-app/src/theme.css

      - name: Build authenticated React Docs Activity
        id: docsbuild
        continue-on-error: true
        run: npm run build --prefix prototypes/docs-app

      - name: Install finalized Activity assets into Bardo
        id: assets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf activity
          mkdir -p activity
          cp -R prototypes/docs-app/dist/. activity/
          test -f activity/index.html
          grep -q "$EXPECTED_ACTIVITY_BUILD" activity/index.html
          grep -q "$EXPECTED_AUTH_BUILD" activity/index.html
          grep -R -q '/api/auth/token' activity/assets
          grep -R -q 'bardo_token' activity/assets
          test -n "$(find activity -maxdepth 2 -type f -name '*.js' -print -quit)"

      - name: Gate production preflight
        id: preflight
        if: always()
        shell: bash
        env:
          CREDS: ${{ steps.creds.outcome }}
          OAUTH_SECRET: ${{ steps.oauthsecret.outcome }}
          ROOT_DEPS: ${{ steps.rootdeps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          MODULES: ${{ steps.modules.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          DOCS_DEPS: ${{ steps.docsdeps.outcome }}
          THEME: ${{ steps.theme.outcome }}
          DOCS_BUILD: ${{ steps.docsbuild.outcome }}
          ASSETS: ${{ steps.assets.outcome }}
        run: |
          set -euo pipefail
          FAILED=0
          for VALUE in "$CREDS" "$OAUTH_SECRET" "$ROOT_DEPS" "$TESTS" "$MODULES" "$PATCH" "$CONTRACTS" "$DOCS_DEPS" "$THEME" "$DOCS_BUILD" "$ASSETS"; do
            if [ "$VALUE" != "success" ]; then FAILED=1; fi
          done
          exit "$FAILED"

      - name: Count existing production documents
        id: before
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT COUNT(*) AS count FROM documents;" --json > /tmp/docs-before.json
          COUNT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/docs-before.json','utf8'));const a=Array.isArray(x)?x:[x];const v=a.flatMap(i=>i.results||[])[0]?.count;if(v===undefined)process.exit(2);process.stdout.write(String(v));")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Existing documents before migration: $COUNT"

      - name: Apply additive D1 migrations
        id: migrate
        run: npx --yes wrangler@4.124.0 d1 migrations apply bardo-db --remote

      - name: Verify guild-auth schema and preserve every document
        id: after
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT COUNT(*) AS count FROM documents; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('document_guild_access','docs_sessions','docs_launch_intents') ORDER BY name;" --json > /tmp/docs-after.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/docs-after.json','utf8'));
          const blocks = Array.isArray(data) ? data : [data];
          const rows = blocks.flatMap(block => block.results || []);
          const countRow = rows.find(row => Object.prototype.hasOwnProperty.call(row, 'count'));
          const names = new Set(rows.map(row => row.name).filter(Boolean));
          const expected = new Set(['document_guild_access','docs_sessions','docs_launch_intents']);
          if (String(countRow?.count) !== process.env.DOCS_BEFORE) throw new Error(`Document count changed: ${countRow?.count} != ${process.env.DOCS_BEFORE}`);
          for (const table of expected) if (!names.has(table)) throw new Error(`Missing table ${table}`);
          console.log(`Documents preserved: ${countRow.count}; guild-auth schema present.`);
          NODE
          COUNT=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/docs-after.json','utf8'));const a=Array.isArray(x)?x:[x];const r=a.flatMap(i=>i.results||[]).find(v=>v.count!==undefined);process.stdout.write(String(r.count));")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
        env:
          DOCS_BEFORE: ${{ steps.before.outputs.count }}

      - name: Deploy existing Bardo Worker with authenticated Docs Activity
        id: deploy
        run: npx --yes wrangler@4.124.0 deploy

      - name: Verify Worker serves guild-auth Bardo Docs
        id: origin
        shell: bash
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 12); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?bardo_build=$GITHUB_SHA&attempt=$ATTEMPT" -o /tmp/bardo-live.html; then
              if grep -q "$EXPECTED_ACTIVITY_BUILD" /tmp/bardo-live.html && grep -q "$EXPECTED_AUTH_BUILD" /tmp/bardo-live.html; then
                echo "Worker origin is serving $EXPECTED_AUTH_BUILD"
                exit 0
              fi
            fi
            sleep 5
          done
          sed -n '1,80p' /tmp/bardo-live.html 2>/dev/null || true
          exit 1

      - name: Record production deployment
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ORIGIN_OUTCOME: ${{ steps.origin.outcome }}
          DOCS_BEFORE: ${{ steps.before.outputs.count }}
          DOCS_AFTER: ${{ steps.after.outputs.count }}
          OAUTH_SECRET: ${{ steps.oauthsecret.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          MODULES: ${{ steps.modules.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          DOCS_BUILD: ${{ steps.docsbuild.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .deploy
          STATUS=failure
          if [ "$DEPLOY_OUTCOME" = "success" ] && [ "$ORIGIN_OUTCOME" = "success" ]; then STATUS=success; fi
          cat > .deploy/bardo-docs-discord-status.txt <<EOF
          status=$STATUS
          architecture=discord-guild-auth-v1
          worker=bardo-discord
          worker_origin=$WORKER_ORIGIN
          source_commit=$GITHUB_SHA
          oauth_secret=$OAUTH_SECRET
          tests=$TESTS
          modules=$MODULES
          worker_patch=$PATCH
          contracts=$CONTRACTS
          docs_build=$DOCS_BUILD
          migration=$MIGRATE
          docs_before=${DOCS_BEFORE:-unknown}
          docs_after=${DOCS_AFTER:-unknown}
          guild_acl=document_guild_access
          session_auth=docs_sessions
          launch_routing=docs_launch_intents
          legacy_command=doc
          legacy_message_ids=preserved
          delete_behavior=soft_archive
          deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-docs-discord-status.txt prototypes/docs-app/src/theme.css
          git commit -m "chore(docs): record authenticated Discord production deployment [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
          test "$STATUS" = "success"

# Manual re-run marker: authenticated guild deploy after DISCORD_CLIENT_SECRET 2026-08-24T00:59Z
