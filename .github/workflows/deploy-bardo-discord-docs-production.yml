name: Deploy Bardo Docs production

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - 'src/**'
      - 'test/**'
      - 'migrations/**'
      - 'prototypes/docs-app/**'
      - 'scripts/apply-activity-diagnostic-route.mjs'
      - '.github/workflows/deploy-bardo-discord-docs-production.yml'
      - 'diagnostics/production-deploy-trigger.txt'
  workflow_dispatch:

concurrency:
  group: bardo-docs-production
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        id: deps
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/tests.log

      - name: Verify production Worker source
        id: worker
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          grep -q "async function handleComponentInteraction(interaction, env, ctx)" src/worker.js
          grep -q "return handleComponentInteraction(interaction, env, ctx);" src/worker.js
          grep -q "return jsonResponse({ type: 12 });" src/worker.js
          grep -q "ctx.waitUntil(persistLaunchContext())" src/worker.js
          grep -q "handleDiscordAuthApi" src/worker.js
          grep -q "handleDocsApi" src/worker.js
          if grep -q "callback?with_response=true" src/worker.js; then
            echo "Legacy remote interaction callback is present" >&2
            exit 1
          fi
          node --check src/worker.js

      - name: Add temporary Discord Activity configuration probe
        id: diagpatch
        continue-on-error: true
        run: |
          node scripts/apply-activity-diagnostic-route.mjs src/worker.js
          grep -q '__bardo_diag_activity_20260823' src/worker.js
          node --check src/worker.js

      - name: Build current Docs Activity
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix prototypes/docs-app --no-audit --no-fund
          npm run build --prefix prototypes/docs-app
          rm -rf activity
          mkdir -p activity
          cp -R prototypes/docs-app/dist/. activity/
          test -f activity/index.html
          grep -q 'docs-current-document-only-v1' activity/index.html

      - name: Production preflight
        id: preflight
        if: always()
        continue-on-error: true
        env:
          DEPS: ${{ steps.deps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WORKER: ${{ steps.worker.outcome }}
          DIAGPATCH: ${{ steps.diagpatch.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          test "$DEPS" = success
          test "$TESTS" = success
          test "$WORKER" = success
          test "$DIAGPATCH" = success
          test "$BUILD" = success

      - name: Count documents before migration
        id: before
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT COUNT(*) AS count FROM documents;" --json 2>&1 | tee /tmp/docs-before.log

      - name: Apply D1 migrations
        id: migrate
        if: steps.preflight.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 d1 migrations apply bardo-db --remote 2>&1 | tee /tmp/migrate.log

      - name: Deploy Worker
        id: deploy
        if: steps.preflight.outcome == 'success' && steps.migrate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4.124.0 deploy --keep-vars 2>&1 | tee /tmp/deploy.log

      - name: Probe live Worker and Discord application
        id: live
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LIVE_HTTP=$(curl -sS -o /tmp/live.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/?production=$GITHUB_SHA")
          LIVE_CURL=$?
          DIAG_HTTP=$(curl -sS -o /tmp/discord-app.json -w '%{http_code}' "$WORKER_ORIGIN/__bardo_diag_activity_20260823")
          DIAG_CURL=$?
          {
            echo "live_curl=$LIVE_CURL"
            echo "live_http=$LIVE_HTTP"
            echo "live_marker=$(grep -c 'docs-current-document-only-v1' /tmp/live.html 2>/dev/null || true)"
            echo "diag_curl=$DIAG_CURL"
            echo "diag_http=$DIAG_HTTP"
            echo "--- discord_app ---"
            cat /tmp/discord-app.json 2>/dev/null || true
          } > /tmp/runtime.txt
          cat /tmp/runtime.txt
          exit 0

      - name: Record production state
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          WORKER: ${{ steps.worker.outcome }}
          DIAGPATCH: ${{ steps.diagpatch.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          BEFORE: ${{ steps.before.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          LIVE: ${{ steps.live.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          STATUS=failure
          if [ "$DEPLOY" = success ] && [ "$LIVE" = success ]; then STATUS=success; fi
          cat > .deploy/bardo-docs-discord-status.txt <<EOF
          status=$STATUS
          source_commit=$GITHUB_SHA
          deps=$DEPS
          tests=$TESTS
          worker=$WORKER
          diagnostic_patch=$DIAGPATCH
          docs_build=$BUILD
          preflight=$PREFLIGHT
          docs_before_query=${BEFORE:-skipped}
          migration=${MIGRATE:-skipped}
          deploy=${DEPLOY:-skipped}
          live=${LIVE:-skipped}
          inline_launch=true
          worker_origin=$WORKER_ORIGIN
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          [ ! -f /tmp/runtime.txt ] || cp /tmp/runtime.txt .deploy/discord-activity-runtime.txt
          [ ! -f /tmp/tests.log ] || tail -n 120 /tmp/tests.log > .deploy/production-tests.log
          [ ! -f /tmp/deploy.log ] || tail -n 120 /tmp/deploy.log > .deploy/production-wrangler-deploy.log
          [ ! -f /tmp/migrate.log ] || tail -n 120 /tmp/migrate.log > .deploy/production-migrate.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-docs-discord-status.txt
          for file in .deploy/discord-activity-runtime.txt .deploy/production-tests.log .deploy/production-wrangler-deploy.log .deploy/production-migrate.log; do
            [ ! -f "$file" ] || git add "$file"
          done
          git commit -m "chore(docs): record deterministic production deployment [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
