name: Diagnose Bardo Docs launch session

on:
  push:
    branches:
      - module/bardo-docs
    paths:
      - '.github/workflows/diagnose-bardo-launch-session.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://bardo-discord.bardo-discord.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify live launch-session recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy
          INSTANCE="diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT id FROM documents WHERE archived_at IS NULL ORDER BY created_at LIMIT 1;" --json > /tmp/doc.json
          DOC_ID=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/doc.json','utf8'));const a=Array.isArray(x)?x:[x];const id=a.flatMap(v=>v.results||[])[0]?.id;if(!id)process.exit(2);process.stdout.write(String(id));")

          cleanup() {
            npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "DELETE FROM activity_contexts WHERE instance_id = '$INSTANCE';" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          curl -fsSL \
            -H 'Accept: application/json' \
            -H "x-bardo-instance-id: $INSTANCE" \
            -H "x-bardo-custom-id: bardo:open:$DOC_ID" \
            "$WORKER_ORIGIN/api/docs?launch_diagnostic=$GITHUB_RUN_ID" > /tmp/response.json

          DOC_ID="$DOC_ID" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/response.json','utf8'));
          const expected = process.env.DOC_ID;
          if (payload.contextDocumentId !== expected) {
            throw new Error(`contextDocumentId mismatch: ${payload.contextDocumentId} !== ${expected}`);
          }
          if (!Array.isArray(payload.documents) || !payload.documents.some(doc => doc.id === expected)) {
            throw new Error('Launch document missing from hydrated documents');
          }
          NODE

          npx --yes wrangler@4.124.0 d1 execute bardo-db --remote --command "SELECT document_id FROM activity_contexts WHERE instance_id = '$INSTANCE';" --json > /tmp/context.json
          DOC_ID="$DOC_ID" node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          const a = Array.isArray(x) ? x : [x];
          const actual = a.flatMap(v => v.results || [])[0]?.document_id;
          if (actual !== process.env.DOC_ID) throw new Error(`D1 context mismatch: ${actual}`);
          NODE
      - name: Persist result
        if: success()
        shell: bash
        run: |
          mkdir -p .deploy
          cat > .deploy/bardo-launch-session-diagnostic.txt <<EOF
          status=success
          launch_fix=discord-custom-id-session-v2
          live_api_recovery=success
          d1_session_recovery=success
          document_mutation=none
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy/bardo-launch-session-diagnostic.txt
          git commit -m "chore(docs): record live launch session diagnostic [skip ci]" || true
          git push origin HEAD:module/bardo-docs || true
