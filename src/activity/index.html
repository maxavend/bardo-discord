<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <title>Bardo · Documento</title>
    <!-- STYLES -->
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="Bardo">
        <div class="brand-mark" aria-hidden="true">
          <img src="<!-- AVATAR_SRC -->" alt="Bardo" class="brand-avatar" />
        </div>
        <div class="brand-copy">
          <strong>Bardo</strong>
          <span>Lector de documentos</span>
        </div>
      </header>

      <section id="loading" class="view-state" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong>Abriendo documento</strong>
          <p>Un momento…</p>
        </div>
      </section>

      <section id="empty" class="view-state" hidden>
        <div class="state-symbol" aria-hidden="true">B</div>
        <div>
          <h1>No hay un documento abierto</h1>
          <p>Abre <strong>Mostrar más</strong> desde un mensaje publicado por Bardo.</p>
        </div>
      </section>

      <section id="error" class="view-state" hidden>
        <div class="state-symbol" aria-hidden="true">!</div>
        <div>
          <h1>No pudimos cargar el documento</h1>
          <p id="error-message">Cierra esta vista y vuelve a abrir el documento desde el mensaje de Bardo.</p>
        </div>
      </section>

      <article id="document" class="document" hidden>
        <header class="document-header">
          <p class="eyebrow">Documento</p>
          <h1 id="document-title"></h1>
          <div id="document-meta" class="meta"></div>

          <div class="document-actions" aria-label="Acciones del documento">
            <div class="select-wrapper">
              <select id="download-select" class="action-select" aria-label="Guardar documento como">
                <option value="" disabled selected>Guardar como</option>
                <option value="pdf">PDF (.pdf)</option>
                <option value="markdown">Markdown (.md)</option>
                <option value="docx">Word (.docx)</option>
              </select>
              <span class="select-arrow" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </div>

            <div class="action-group-right">
              <button id="edit-document" class="action-button action-button-secondary" type="button" aria-label="Editar documento">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                  <path d="m15 5 4 4"/>
                </svg>
                <span class="btn-text">Editar</span>
              </button>
              <button id="copy-document" class="action-button action-button-icon" type="button" title="Copiar todo" aria-label="Copiar todo">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="action-status-container">
            <span id="action-status" class="action-status" aria-live="polite"></span>
          </div>
        </header>

        <!-- Barra de formato estilo Notion (Sticky y flotante durante el scroll) -->
        <div id="editor-toolbar" class="editor-toolbar" style="display: none;" aria-label="Herramientas de formato">
          <div class="toolbar-group">
            <div class="custom-select-wrap tb-select-wrap">
              <select id="tb-block-type" class="tb-select" aria-label="Tipo de bloque">
                <option value="p">Párrafo</option>
                <option value="h1">Encabezado 1</option>
                <option value="h2">Encabezado 2</option>
                <option value="h3">Encabezado 3</option>
                <option value="blockquote">Cita</option>
                <option value="pre">Código</option>
              </select>
              <span class="select-arrow" aria-hidden="true">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
              </span>
            </div>
          </div>

          <div class="tb-divider"></div>

          <div class="toolbar-group">
            <button type="button" class="tb-btn" data-format="bold" title="Negrita (Ctrl+B)" aria-label="Negrita">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h9a4 4 0 0 1 0 8H6v-8Zm0 0h8a3.5 3.5 0 0 0 0-7H6v7Z"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="italic" title="Cursiva (Ctrl+I)" aria-label="Cursiva">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="strikeThrough" title="Tachado" aria-label="Tachado">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="inlineCode" title="Código inline (Ctrl+E)" aria-label="Código inline">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="link" title="Enlace (Ctrl+K)" aria-label="Insertar enlace">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </button>
          </div>

          <div class="tb-divider"></div>

          <div class="toolbar-group">
            <button type="button" class="tb-btn" data-format="bulletList" title="Lista con viñetas" aria-label="Lista con viñetas">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="numberList" title="Lista numerada" aria-label="Lista numerada">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="table" title="Insertar tabla" aria-label="Insertar tabla">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M12 3v18"/></svg>
            </button>
            <button type="button" class="tb-btn" data-format="divider" title="Línea divisoria" aria-label="Línea divisoria">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/></svg>
            </button>
          </div>

          <div class="tb-divider"></div>

          <div class="toolbar-hint">
            <span>Escribe <code>/</code> para comandos</span>
          </div>
        </div>

        <!-- Menú flotante Slash Command estilo Notion -->
        <div id="slash-command-menu" class="slash-command-menu" style="display: none;" role="menu"></div>

        <!-- Menú flotante de selección de texto -->
        <div id="selection-bubble-menu" class="selection-bubble-menu" style="display: none;" role="toolbar" aria-label="Formato rápido">
          <button type="button" class="bubble-btn" data-format="bold" title="Negrita">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h9a4 4 0 0 1 0 8H6v-8Zm0 0h8a3.5 3.5 0 0 0 0-7H6v7Z"/></svg>
          </button>
          <button type="button" class="bubble-btn" data-format="italic" title="Cursiva">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
          </button>
          <button type="button" class="bubble-btn" data-format="strikeThrough" title="Tachado">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
          </button>
          <button type="button" class="bubble-btn" data-format="inlineCode" title="Código">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
          <button type="button" class="bubble-btn" data-format="link" title="Enlace">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
          <span class="bubble-divider"></span>
          <button type="button" class="bubble-btn" data-format="h1" title="Título 1">H1</button>
          <button type="button" class="bubble-btn" data-format="h2" title="Título 2">H2</button>
          <button type="button" class="bubble-btn" data-format="blockquote" title="Cita">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>
          </button>
        </div>

        <div id="document-body" class="markdown-body"></div>
      </article>
    </main>

    <!-- SCRIPTS -->
  </body>
</html>
