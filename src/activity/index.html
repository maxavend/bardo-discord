<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <title>Bardo · Documento</title>
    <!-- STYLES -->
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="Bardo">
        <div class="brand-mark" aria-hidden="true">
          <img src="<!-- AVATAR_SRC -->" alt="Bardo" class="brand-avatar" />
        </div>
        <div class="brand-copy">
          <strong>Bardo</strong>
          <span>Lector de documentos</span>
        </div>
      </header>

      <section id="loading" class="view-state" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong>Abriendo documento</strong>
          <p>Un momento…</p>
        </div>
      </section>

      <section id="empty" class="view-state" hidden>
        <div class="state-symbol" aria-hidden="true">B</div>
        <div>
          <h1>No hay un documento abierto</h1>
          <p>Abre <strong>Mostrar más</strong> desde un mensaje publicado por Bardo.</p>
        </div>
      </section>

      <section id="error" class="view-state" hidden>
        <div class="state-symbol" aria-hidden="true">!</div>
        <div>
          <h1>No pudimos cargar el documento</h1>
          <p id="error-message">Cierra esta vista y vuelve a abrir el documento desde el mensaje de Bardo.</p>
        </div>
      </section>

      <article id="document" class="document" hidden>
        <header class="document-header">
          <p class="eyebrow">Documento</p>
          <h1 id="document-title"></h1>
          <div id="document-meta" class="meta"></div>

          <div class="document-actions" aria-label="Acciones del documento">
            <button id="copy-document" class="action-button action-button-primary" type="button">
              Copiar todo
            </button>
            <div class="download-actions" role="group" aria-label="Descargar documento">
              <span class="download-label">Descargar</span>
              <button id="download-pdf" class="action-button" type="button">PDF</button>
              <button id="download-markdown" class="action-button" type="button">Markdown</button>
              <button id="download-word" class="action-button" type="button">Word</button>
            </div>
            <span id="action-status" class="action-status" aria-live="polite"></span>
          </div>
        </header>
        <div id="document-body" class="markdown-body"></div>
      </article>
    </main>

    <!-- SCRIPTS -->
  </body>
</html>
