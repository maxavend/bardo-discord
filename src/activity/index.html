<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <title>Bardo · Documento</title>
    <!-- STYLES -->
    <style>
      .document-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        margin-top: 24px;
      }

      .download-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .download-label {
        margin-right: 2px;
        color: #8f949d;
        font-size: 12px;
        font-weight: 650;
      }

      .action-button {
        min-height: 34px;
        padding: 7px 11px;
        border: 1px solid #35383f;
        border-radius: 9px;
        background: #1b1d21;
        color: #dfe2e7;
        font-size: 12px;
        font-weight: 650;
        line-height: 1;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }

      .action-button:hover {
        border-color: #4a4e57;
        background: #24272c;
      }

      .action-button:active {
        transform: translateY(1px);
      }

      .action-button:focus-visible {
        outline: 2px solid #8ea1ff;
        outline-offset: 2px;
      }

      .action-button-primary {
        border-color: #dfe2e7;
        background: #e7e9ed;
        color: #18191c;
      }

      .action-button-primary:hover {
        border-color: #ffffff;
        background: #ffffff;
      }

      .action-status {
        min-height: 1em;
        color: #8f949d;
        font-size: 12px;
      }

      .action-status.is-error {
        color: #f09a9a;
      }

      @media (max-width: 640px) {
        .document-actions {
          align-items: flex-start;
          flex-direction: column;
          margin-top: 20px;
        }

        .download-actions {
          width: 100%;
        }

        .download-label {
          width: 100%;
          margin-bottom: 2px;
        }
      }

      @media (prefers-color-scheme: light) {
        .action-button {
          border-color: #d9dce2;
          background: #ffffff;
          color: #303239;
        }

        .action-button:hover {
          border-color: #c4c8d0;
          background: #f2f3f5;
        }

        .action-button-primary {
          border-color: #25272c;
          background: #25272c;
          color: #ffffff;
        }

        .action-button-primary:hover {
          border-color: #111214;
          background: #111214;
        }
      }

      @media print {
        @page {
          size: auto;
          margin: 18mm 18mm 20mm;
        }

        :root,
        body {
          background: #ffffff !important;
          color: #18191c !important;
        }

        body {
          min-height: auto !important;
          overflow: visible !important;
        }

        .shell {
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        .topbar,
        .document-actions,
        .eyebrow,
        .meta,
        .view-state {
          display: none !important;
        }

        .document {
          display: block !important;
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        .document-header {
          padding: 0 0 14pt !important;
          border-bottom: 1px solid #d8dadd !important;
        }

        .document-header h1 {
          max-width: none !important;
          color: #111214 !important;
          font-size: 26pt !important;
          line-height: 1.08 !important;
          letter-spacing: -0.02em !important;
        }

        .markdown-body {
          padding-top: 16pt !important;
          color: #25272c !important;
          font-size: 10.5pt !important;
          line-height: 1.52 !important;
          overflow: visible !important;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body strong {
          color: #111214 !important;
        }

        .markdown-body h1 { font-size: 19pt !important; }
        .markdown-body h2 { font-size: 15pt !important; }
        .markdown-body h3 { font-size: 12pt !important; }

        .markdown-body blockquote {
          border-left-color: #7c8088 !important;
          background: #f4f5f6 !important;
          color: #34363b !important;
          break-inside: avoid;
        }

        .markdown-body a { color: #1f4f99 !important; }

        .markdown-body code {
          border-color: #d8dadd !important;
          background: #f3f4f5 !important;
          color: #1f2023 !important;
        }

        .markdown-body pre {
          border-color: #d8dadd !important;
          background: #f3f4f5 !important;
          color: #1f2023 !important;
          break-inside: avoid;
          white-space: pre-wrap !important;
        }

        .markdown-body pre code { color: #1f2023 !important; }

        .table-wrap {
          overflow: visible !important;
          border-color: #d8dadd !important;
          break-inside: avoid;
        }

        .markdown-body table {
          background: #ffffff !important;
          font-size: 9.5pt !important;
        }

        .markdown-body th {
          background: #f0f1f2 !important;
          color: #111214 !important;
        }

        .markdown-body th,
        .markdown-body td { border-color: #d8dadd !important; }
        .markdown-body hr { background: #d8dadd !important; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="Bardo">
        <div class="brand-mark" aria-hidden="true">
          <img src="<!-- AVATAR_SRC -->" alt="Bardo" class="brand-avatar" />
        </div>
        <div class="brand-copy">
          <strong>Bardo</strong>
          <span>Lector de documentos</span>
        </div>
      </header>

      <section id="loading" class="view-state" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>
          <strong>Abriendo documento</strong>
          <p>Un momento…</p>
        </div>
      </section>

      <section id="empty" class="view-state" hidden>
        <div class="state-symbol" aria-hidden="true">B</div>
        <div>
          <h1>No hay un documento abierto</h1>
          <p>Abre <strong>Mostrar más</strong> desde un mensaje publicado por Bardo.</p>
        </div>
      </section>

      <section id="error" class="view-state" hidden>
        <div class="state-symbol" aria-hidden="true">!</div>
        <div>
          <h1>No pudimos cargar el documento</h1>
          <p id="error-message">Cierra esta vista y vuelve a abrir el documento desde el mensaje de Bardo.</p>
        </div>
      </section>

      <article id="document" class="document" hidden>
        <header class="document-header">
          <p class="eyebrow">Documento</p>
          <h1 id="document-title"></h1>
          <div id="document-meta" class="meta"></div>

          <div class="document-actions" aria-label="Acciones del documento">
            <button id="copy-document" class="action-button action-button-primary" type="button">
              Copiar todo
            </button>
            <div class="download-actions" role="group" aria-label="Descargar documento">
              <span class="download-label">Descargar</span>
              <button id="download-pdf" class="action-button" type="button">PDF</button>
              <button id="download-markdown" class="action-button" type="button">Markdown</button>
              <button id="download-word" class="action-button" type="button">Word</button>
            </div>
            <span id="action-status" class="action-status" aria-live="polite"></span>
          </div>
        </header>
        <div id="document-body" class="markdown-body"></div>
      </article>
    </main>

    <!-- SCRIPTS -->
  </body>
</html>
